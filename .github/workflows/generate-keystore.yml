name: Générer le keystore

# À lancer UNE fois manuellement : onglet Actions > Générer le keystore > Run workflow.
# Ensuite : copier le contenu de l'artifact keystore-base64 dans un secret GitHub
# nommé KEYSTORE_BASE64 (Réglages > Secrets and variables > Actions).
# Les prochains builds produiront un app-release.apk signé, toujours avec la même
# signature (indispensable pour publier sur Google Play ou mettre à jour l'app).

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Générer la clé de signature (validité 10 000 jours)
        run: |
          keytool -genkeypair -v \
            -keystore randogpx.jks \
            -alias randogpx \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 \
            -storepass randogpx2026 -keypass randogpx2026 \
            -dname "CN=RandoGPX, O=Mathieu Bouvier, C=FR"

      - name: Préparer le base64
        run: |
          base64 -w 0 randogpx.jks > keystore-base64.txt
          echo "Taille du keystore : $(wc -c < randogpx.jks) octets"
          echo "Taille du base64 : $(wc -c < keystore-base64.txt) caractères"

      - name: Instructions
        run: |
          echo "=============================================="
          echo "PROCHAINES ÉTAPES (une seule fois) :"
          echo "1. Téléchargez l'artifact keystore-base64"
          echo "2. Ouvrez le fichier et copiez TOUT son contenu"
          echo "3. Réglages du dépôt > Secrets and variables > Actions"
          echo "   > New repository secret > Nom : KEYSTORE_BASE64"
          echo "4. Collez le contenu, puis enregistrez"
          echo "5. Relancez le build : un app-release.apk signé apparaîtra"
          echo "=============================================="

      - name: Publier le keystore en artifact (à conserver précieusement !)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-randogpx
          path: randogpx.jks
          retention-days: 90

      - name: Publier le base64 en artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore-base64.txt
          retention-days: 90
