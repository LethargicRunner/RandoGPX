name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Préparer la signature release (si keystore configuré)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p release-signing
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release-signing/randogpx.jks
            echo "Keystore présent : l'APK release sera signé."
          else
            echo "Pas de keystore configuré : APK debug uniquement."
            echo "Voir le workflow 'Générer le keystore' puis le secret KEYSTORE_BASE64."
          fi

      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Compiler les APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Rassembler les APK à publier
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/
            echo "APK release signé ajouté."
          fi
          ls -la dist/

      - name: Publier les APK en Release (téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8
          name: RandoGPX v1.8
          body: |
            🥾 RandoGPX v1.8

            Navigation GPX pour la randonnée.

            Nouveautés v1.8 :
            • Export GPX automatique du parcours réel en fin de rando
              (Documents/RandoGPX — visible dans « Mes GPX »)
            • Trace du parcours dessinée en direct, visible aussi en
              usage libre (sans GPX importé)
            • Nouveau marqueur de position : pastille bleue à anneau
              blanc, bien plus visible
            • Déplacer la carte coupe le suivi automatiquement : le
              bouton « Suivi » sert à se recentrer
            • v1.7 (rappel) :
            • Rappel de sécurité au Départ : « avez-vous prévenu un ami ? »
            • Contact d'urgence : définition + SMS de procédure expliquant
              quoi faire en cas de réception d'un SOS
            • Bouton Urgence : SMS SOS avec coordonnées GPS et lien carte,
              partage de position, appel 112, coordonnées en grand
            • v1.6 (rappel) :
            • Boussole d'orientation : cadran, cap en degrés, cardinal,
              direction et distance du prochain waypoint
            • Prévisions météo sur 7 jours (Open-Meteo)
            • Éphémérides hors-ligne : lever/coucher du soleil, durée du
              jour, lumière restante, phase de lune
            • v1.5 (rappel) :
            • Écran « À propos » avec les attributions obligatoires
              (OpenStreetMap, OpenTopoMap, IGN, Open-Meteo, osmdroid)
            • Infrastructure de build release signé (prêt pour Google Play) :
              app-release.apk signé si le keystore est configuré
            • APK debug toujours disponible pour tester

            📲 Téléchargez un APK ci-dessous et installez-le
            (autoriser les applications inconnues sur le téléphone).
            Pour un usage courant, préférez app-release.apk (signé).
          files: |
            dist/*
          make_latest: true

      - name: Publier aussi en Artifacts (secours)
        uses: actions/upload-artifact@v4
        with:
          name: RandoGPX-APK
          path: dist/*
          retention-days: 90
