name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK en Release (téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4
          name: RandoGPX v1.4
          body: |
            🥾 RandoGPX v1.4

            Navigation GPX pour la randonnée.

            Nouveautés depuis la v1.1 :
            • v1.2 — Service GPS au premier plan, Départ/Pause/Reprendre,
              sauvegarde auto toutes les 5 min + récupération après crash
            • v1.3 — GPS adaptatif (resserré près des virages, lâche en ligne
              droite), GPS coupé pendant les pauses
            • v1.4 — Navigation turn-by-turn (flèches ↰ ↱ ↑, bip aux
              bifurcations), demi-tour guidé hors tracé, bouton « Finir ici »
              avec guidage retour au point de départ, nouvelle icône,
              téléchargement hors-ligne corrigé (OpenTopoMap / IGN Plan)

            📲 Téléchargez **app-debug.apk** ci-dessous et installez-le
            (autoriser les applications inconnues sur le téléphone).
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

      - name: Publier aussi en Artifact (secours)
        uses: actions/upload-artifact@v4
        with:
          name: RandoGPX-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
