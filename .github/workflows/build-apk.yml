name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Préparer la signature release (si keystore configuré)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p release-signing
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release-signing/randogpx.jks
            echo "Keystore présent : l'APK release sera signé."
          else
            echo "Pas de keystore configuré : APK debug uniquement."
            echo "Voir le workflow 'Générer le keystore' puis le secret KEYSTORE_BASE64."
          fi

      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Compiler les APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Rassembler les APK à publier
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/
            echo "APK release signé ajouté."
          fi
          ls -la dist/

      - name: Lire la version (automatique)
        id: version
        run: echo "version=$(grep 'versionName' app/build.gradle.kts | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Extraire les notes de la dernière version
        run: |
          awk '/^## /{n++} n>=2{exit} n==1' CHANGELOG.md > release_body.md
          head -50 release_body.md

      - name: Publier les APK en Release (téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: RandoGPX v${{ steps.version.outputs.version }}
          body_path: release_body.md
          files: |
            dist/*
          make_latest: true

      - name: Publier aussi en Artifacts (secours)
        uses: actions/upload-artifact@v4
        with:
          name: RandoGPX-APK
          path: dist/*
          retention-days: 90
