name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK en Release (téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          name: RandoGPX v1.1
          body: |
            🥾 RandoGPX v1.1

            Navigation GPX pour la randonnée : suivi GPS, alerte hors-tracé,
            stats de parcours, waypoints, cartes OSM/OpenTopoMap/IGN,
            mode hors-ligne, bibliothèque de GPX, journaux avec météo.

            📲 Téléchargez **app-debug.apk** ci-dessous et installez-le
            (autoriser les applications inconnues sur le téléphone).
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

      - name: Publier aussi en Artifact (secours)
        uses: actions/upload-artifact@v4
        with:
          name: RandoGPX-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
